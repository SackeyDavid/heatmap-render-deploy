<!doctype html>
<!--
  RECONSTRUCTED FIXTURE, NOT A CAPTURE.
  Built by hand from the selectors the delivered Seat Cover Solutions script uses (vehicle selector
  selects, #vehicle-submit-button, .td-card[aria-label^='Play video review'], .td-tab-btn "Photo
  Reviews"). It is NOT a saved copy of seatcoversolutions.com. A real capture needs David's saved HTML
  (see docs/OPEN.md). Until then the Phase 1 gate "lint-clean script for a known site" is only
  partly met.
-->
<html>
<head><title>Seat Cover Solutions (reconstructed fixture)</title></head>
<body>
  <header><h1>Custom seat covers</h1></header>
  <div class="vehicle-menu-container select-your-vehicle">
    <select id="vehicle-year" name="year" aria-label="Select year"><option value="">Year</option><option value="2021">2021</option></select>
    <select id="vehicle-make" name="make" aria-label="Select make"><option value="">Make</option><option value="ford">Ford</option></select>
    <select id="vehicle-model" name="model" aria-label="Select model"><option value="">Model</option><option value="f150">F-150</option></select>
    <div class="vehicle-button"><button id="vehicle-submit-button" type="button">Find my seat covers</button></div>
  </div>
  <section id="reviews">
    <div class="td-tabs">
      <button class="td-tab-btn active" type="button">Video Reviews</button>
      <button class="td-tab-btn" type="button">Photo Reviews</button>
    </div>
    <div class="td-card" role="button" aria-label="Play video review from Dana">Dana</div>
    <div class="td-card" role="button" aria-label="Play video review from Marcus">Marcus</div>
    <div class="td-card" role="button" aria-label="Play video review from Priya">Priya</div>
    <div class="td-card" role="button" aria-label="Play video review from Lee">Lee</div>
    <div class="td-card" role="button" aria-label="Play video review from Sam">Sam</div>
  </section>
</body>
</html>

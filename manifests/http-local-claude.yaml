# Local HTTP manifest with the Claude agent as the INTERPRETER (select with HEATMAP_MANIFEST=manifests/http-local-claude.yaml,
# or npm run serve:claude / npm run local:stack:claude). Costs Claude usage (one small `claude -p` run per request that arrives
# without an interpretation from the browser helper).
#
# Who does what: when a request arrives WITHOUT an interpretation (no in-browser helper), the confirm step asks the Claude agent to read
# the description and write interpretation.json (the same JSON the browser helper produces). Fixed code validates it against the page,
# the merchant approves what was understood, and the deterministic builder renders the script. The agent never writes the script.
agents:
  claude-code: { adapter: ClaudeCodeRunner }
  builder: { adapter: klaviyo.rule-table-builder }   # renders the approved interpretation; no model

bindings:
  remoteStorage: local-fs
  workspace: local-fs
  pageInspector: { adapter: saved-html, fallbackRoots: [fixtures/pages] }   # saved pages of this request, then the repo's sample pages (local only)
  contextPack: fixture
  jobStore: file
  notifier: console

operations:
  klaviyo.segmentation-script:
    adapter: KlaviyoSegmentationOperation
    steps:
      - inspect: {}
      - confirm: { interpreter: claude-code, interpretPrompt: prompts/klaviyo/interpret.md, maxTurns: 8, timeoutMs: 180000 }
      - generate: { agent: builder, prompt: prompts/klaviyo/generate.md, repairPrompt: prompts/klaviyo/repair.md, context: klaviyo-onsite-events@v2 }
      - qa: { gates: [klaviyo.contract-lint], maxRepairLoops: 0 }   # the builder's output is deterministic: a repair run would be identical
      - publish: { key: "sites/{siteId}/klaviyo/{version}/script.js", pointer: "sites/{siteId}/klaviyo/current.json" }
      - verify: { verifier: klaviyo.test-profile }
      - notify: { failure: warn }   # the script is already live; a failed email is a warning, not a failed job

# The only place adapters are chosen. Composition validates this at startup.
agents:
  fake: { adapter: FakeAgent, outputsFrom: fixtures/fake-agent/klaviyo }   # serves canned outputs; no model
  fake-generic: { adapter: FakeAgent, outputsFrom: fixtures/fake-agent/generic-heatmap-events }
  claude-code: { adapter: DisabledAgent }                                   # no real-agent spend from the local CLI; see manifests/live.yaml for the real one
  # kimi-code and cursor-sdk arrive in Phase 4

bindings:
  remoteStorage: local-fs      # s3: see http-production.example.yaml
  workspace: local-fs
  pageInspector: fixture       # saved-html reads real saved pages (see http-local.yaml); a live-fetch inspector is not built
  contextPack: fixture
  jobStore: file
  notifier: console

operations:
  klaviyo.segmentation-script:
    adapter: KlaviyoSegmentationOperation
    steps:
      - inspect: {}
      - generate: { agent: fake, fallback: claude-code, prompt: prompts/klaviyo/generate.md, repairPrompt: prompts/klaviyo/repair.md, context: klaviyo-onsite-events@v2 }
      - qa: { gates: [klaviyo.contract-lint], maxRepairLoops: 2 }   # browser-harness and agent-review: Phase 2
      - publish: { key: "sites/{siteId}/klaviyo/{version}/script.js", pointer: "sites/{siteId}/klaviyo/current.json" }
      - verify: { verifier: klaviyo.test-profile }
      - notify: { failure: warn }   # the script is already live by then; a failed email is a warning, not a failed job

  generic.heatmap-events:
    adapter: GenericHeatmapEventsOperation
    steps:
      - inspect: {}
      - generate: { agent: fake-generic, fallback: claude-code, prompt: prompts/generic-heatmap-events/generate.md, repairPrompt: prompts/generic-heatmap-events/repair.md, context: klaviyo-onsite-events@v2 }
      - qa: { gates: [generic.heatmap-events.contract-lint], maxRepairLoops: 2 }
      - publish: { key: "sites/{siteId}/heatmap-events/{version}/script.js", pointer: "sites/{siteId}/heatmap-events/current.json" }
      - verify: { verifier: generic.heatmap-events.test-profile }
      - notify: { failure: warn }   # the script is already live by then; a failed email is a warning, not a failed job
